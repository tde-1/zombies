<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';">
<title>ENW Zombies</title>
<link rel="stylesheet" href="shell.css">
<style>
  body { padding: 0; }
  .pw { padding: 26px 28px; }
  .pw h1 { font-size: 17px; margin: 0 0 4px; color: var(--bone); font-weight: 700; }
  .pw p { color: var(--text-dim); margin: 0 0 18px; font-size: 13px; line-height: 1.5; }
  .pw .site { font-family: Consolas, monospace; font-size: 12px; color: var(--olive); }
  .pw input { margin-bottom: 12px; }
  .pw .row { display: flex; gap: 8px; }
  .pw .row button { flex: 1; }
  .pw .bad {
    color: var(--blood-bright); font-size: 12px; margin: -4px 0 12px;
    display: none;
  }
  .pw .bad.on { display: block; }
</style>
</head>
<body>
<div class="pw">
  <h1>ENW Zombies is in a closed beta</h1>
  <p>It is behind one shared password. B will have sent it to you along with this launcher —
     it is the same for everybody, and it is not your account password.</p>
  <p class="site" id="site"></p>
  <div class="bad" id="bad">That password was not accepted. Check it and try again.</div>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <div class="row">
    <button class="primary" id="ok">Continue</button>
    <button class="ghost" id="cancel">Cancel</button>
  </div>
</div>
<script type="module" src="password.js"></script>
</body>
</html>
