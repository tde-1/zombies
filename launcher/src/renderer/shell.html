<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
<title>ENW Zombies</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>

<div id="topbar">
  <div class="brand"><span class="enw">ENW</span><span class="zm">ZOMBIES</span></div>
  <div class="nav">
    <button id="navBack" title="Back">&#8592;</button>
    <button id="navFwd" title="Forward">&#8594;</button>
    <button id="navReload" title="Reload">&#8635;</button>
  </div>
  <span class="pill" id="sitePill" title="Which site the launcher is showing">site: …</span>
  <div class="spacer"></div>
  <span class="pill" id="setupPill" title="Where the ENW client is installed">client: …</span>
  <span class="pill" id="accountPill">Sign in</span>
  <span class="pill" id="settingsPill">Settings</span>
</div>

<!-- The wrapped site is a native view underneath, edge to edge below the topbar; these
     screens replace it, never cover it. There is no overlay anywhere in this app.

     THERE IS NO RAIL ANY MORE (2026-09-22). The launcher used to draw its own right-hand
     column - selected-map card, Play / Play Local / Custom, a map list and a status block -
     and every one of those is on the site's own home, in ITS left column, which is the one
     place B decided a party is managed and a map is picked. Two copies of the map list is
     one copy too many, and the rail's 320 px was what squeezed the site under its own
     1080 px breakpoint so that left column never appeared at all. The shell keeps what only
     a native app can do: setup, settings, the boot screen, and the topbar. -->

<div class="screen wide" id="firstRun">
  <h1>Set up</h1>
  <div id="frBody"></div>
  <div class="actions" id="frActions"></div>
</div>

<div class="screen wide" id="boot">
  <div class="art"><div class="label">
    <div class="mode" id="bootMode">Custom</div>
    <div class="name" id="bootMap">—</div>
  </div></div>
  <div class="flow">
    <div class="steps" id="bootSteps"></div>
    <div class="actions">
      <button id="bootCancel">Cancel</button>
      <button id="bootClose" class="ghost">Back to the site</button>
    </div>
    <div id="bootNotes"></div>
  </div>
</div>

<div class="screen" id="settings">
  <h1>Settings</h1>
  <h2>Status</h2>
  <div id="statusBody"></div>
  <div id="settingsBody"></div>
  <h2>Where things are</h2>
  <div id="pathsBody"></div>
  <h2>Storage</h2>
  <div id="storageBody"></div>
  <div class="actions">
    <button id="openRoot">Open the ENW folder</button>
    <button id="openLogs">Open logs</button>
    <button id="btnUninstall">Remove the ENW client</button>
    <button class="ghost" id="settingsClose">Close</button>
  </div>
</div>

<div class="screen" id="detail">
  <h1 id="detailTitle">Detection</h1>
  <div id="detailBody"></div>
  <div class="actions"><button id="detailClose">Close</button></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="shell.js"></script>
</body>
</html>
