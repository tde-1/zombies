  ann_insta_kill:      {zone: localized_nazi_zombie_factory, file: voiceovers/zombie/ann/ann_instakill.wav, alias: insta_vox}
  ann_double_points:   {zone: localized_nazi_zombie_factory, file: voiceovers/zombie/ann/ann_doublepoints.wav, alias: dp_vox}
  ann_nuke:            {zone: localized_nazi_zombie_factory, file: voiceovers/zombie/ann/ann_nuke.wav, alias: nuke_vox}
  ann_carpenter:       {zone: localized_nazi_zombie_factory, file: voiceovers/zombie/ann/ann_carpenter.wav, alias: carp_vox}
  # hits
  hit_marker:          {zone: common_mp, file: sfx/mp/mp_hit_indication_3c.wav, alias: "MP_hit_alert (multiplayer; stock zombies plays none)"}
  player_hit:          {zone: common, file: sfx/character/player/pain_small/pain_small_00.wav, alias: "player_pain_small (variant 0 of 8)"}
  zombie_swipe:        {zone: localized_nazi_zombie_factory, file: sfx/levels/zombie/whoosh/whoosh_00.wav, alias: "attack_whoosh (variant 0 of 3)"}
  # pack-a-punch
  pap_upgrade:         {zone: localized_nazi_zombie_factory, file: sfx/levels/zombie/perksacola/packa_upgrade_weap.wav, alias: packa_weap_upgrade}
  pap_ready:           {zone: localized_nazi_zombie_factory, file: sfx/levels/zombie/perksacola/packa_weap_ready.wav, alias: packa_weap_ready}
  pap_sting:           {zone: localized_nazi_zombie_factory, file: sfx/levels/zombie/perksacola/jingle/packa_sting.wav, alias: mx_packa_sting}
