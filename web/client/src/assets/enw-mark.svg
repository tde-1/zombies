<!-- The W really reaches x = 321.8. The box used to say 320, which shaved the tip of its
     top-right stroke off at every size the site draws the mark. Same paths, corrected box.

     The box also STARTS at the ink now. The E's left edge is at x = 2.05, so a box beginning at
     0 carried 2.05 units of empty air down its left side — 0.74px at the 56px mark — and every
     rule that lines something up with "the mark" was lining it up with that air instead of with
     the E. min-x is 2.05 and the width is 319.75 (321.8 - 2.05), so box == ink on both sides and
     the wordmark under it can be matched to the picture rather than to the picture's padding.
     The paths are untouched; only the window onto them moved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.05 0 319.75 156" fill="#fff">
  <path d="M2.05 0 70 0 70 30 2.05 30Z"/>
  <path d="M20.05 66 70 66 70 93.9 20.05 93.9Z"/>
  <path d="M2.05 128 70 128 70 156 2.05 156Z"/>
  <path d="M76.22 2.51 168 88.64 168 0 198 0 198 154.04 102.04 66.5 102.04 156 76.22 156Z"/>
  <path d="M204 148.74 228.82 80.79 259.32 151.48 321.8 0 287.99 0 259.48 73.33 231.19 1.3 204 65.78Z"/>
</svg>
